<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pengumuman Lomba</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      background: #1e293b;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      color: #38bdf8;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .search-box {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-bottom: 20px;
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
      border: 1px solid transparent;
    }

    .card:hover {
      transform: scale(1.03);
      border: 1px solid #38bdf8;
    }

    .card h3 {
      margin: 0;
      color: #38bdf8;
    }

    .card p {
      font-size: 14px;
      color: #cbd5e1;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      background: #38bdf8;
      color: black;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 10px;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
    }

    .close {
      float: right;
      cursor: pointer;
      color: red;
      font-size: 20px;
    }

    .juara-box {
      margin-top: 15px;
      background: #0ea5e9;
      padding: 10px;
      border-radius: 10px;
      color: black;
    }

    .juara-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }

    .juara-table td {
      padding: 6px;
      border-bottom: 1px solid rgba(0,0,0,0.2);
    }

    button {
      margin-top: 10px;
      padding: 10px;
      border: none;
      background: #38bdf8;
      color: black;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    /* FORM */
    .form-box {
      margin-top: 30px;
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
    }

    .form-box h3 {
      color: #38bdf8;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    textarea {
      height: 80px;
      resize: none;
    }
  </style>
</head>

<body>

<header>
  🎉 Pengumuman Lomba SMK KRISTEN PELANGI MAKALE
</header>

<div class="container">

  <input type="text" class="search-box" id="search" placeholder="Cari lomba...">

  <div class="grid" id="listLomba"></div>

  <!-- FORM -->
  <div class="form-box">
    <h3>📩 Konfirmasi Pengambilan Hadiah</h3>

    <input id="nama" placeholder="Nama siswa">
    <input id="kelas" placeholder="Kelas (contoh: XII TKJ)">
    <input id="lombaInput" placeholder="Jenis Lomba">
    <input id="juaraInput" placeholder="Juara Keberapa Anda">
    <textarea id="pesan" placeholder="Isi konfirmasi... (CASH / REKENING)"></textarea>

    <button onclick="kirimWA()">Kirim Konfirmasi</button>
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="tutupModal()">✖</span>

    <h2 id="judul"></h2>
    <p id="detail"></p>

    <div class="juara-box">
      <b>🏆 Pemenang Lomba</b>
      <table class="juara-table" id="juaraTable"></table>
    </div>

    <button onclick="tutupModal()">Tutup</button>
  </div>
</div>

<script>

const lomba = [
  {
    judul: "Lomba Coding TKJ",
    deskripsi: "Membuat aplikasi web sederhana.",
    detail: "Tanggal: 30 Juni 2026\nLokasi: Lab Komputer\nHadiah: Uang Pendidikan",
    juara: `
      <tr><td>🥇 Juara 1</td><td>Asef</td></tr>
      <tr><td>🥈 Juara 2</td><td>Rhati</td></tr>
      <tr><td>🥉 Juara 3</td><td>Chalvin</td></tr>
      <tr><td>🥉 Harapan 1</td><td>Putri</td></tr>
      <tr><td>🥉 Harapan 2</td><td>Tiara</td></tr>
      <tr><td>🥉 Harapan 3</td><td>Biaca</td></tr>
      <tr><td>🥉 Harapan 4</td><td>Julisa</td></tr>
      <tr><td>🥉 Harapan 5</td><td>Naftalia</td></tr>
    `
  },
  {
    judul: "Lomba Desain Poster",
    deskripsi: "Poster tema teknologi.",
    detail: "Tanggal: 27 Mei 2026\nLokasi: Multimedia\nHadiah: Sertifikat",
    juara: `
      <tr><td>🥇 Juara 1</td><td>...</td></tr>
      <tr><td>🥈 Juara 2</td><td>...</td></tr>
      <tr><td>🥉 Juara 3</td><td>...</td></tr>
    `
  }
];

const list = document.getElementById("listLomba");
const search = document.getElementById("search");

function tampil(data) {
  list.innerHTML = "";
  data.forEach((item, index) => {
    list.innerHTML += `
      <div class="card" onclick="bukaModal(${index})">
        <h3>${item.judul}</h3>
        <p>${item.deskripsi}</p>
        <span class="badge">Lihat Detail</span>
      </div>
    `;
  });
}

function bukaModal(index) {
  document.getElementById("judul").innerText = lomba[index].judul;
  document.getElementById("detail").innerText = lomba[index].detail;
  document.getElementById("juaraTable").innerHTML = lomba[index].juara;
  document.getElementById("modal").style.display = "flex";
}

function tutupModal() {
  document.getElementById("modal").style.display = "none";
}

function kirimWA() {
  const nama = document.getElementById("nama").value.trim();
  const kelas = document.getElementById("kelas").value.trim();
  const lombaInput = document.getElementById("lombaInput").value.trim();
  const juara = document.getElementById("juaraInput").value.trim();
  const pesan = document.getElementById("pesan").value.trim();

  if (!nama || !kelas || !lombaInput || !juara || !pesan) {
    alert("Lengkapi semua data!");
    return;
  }

  let ditemukan = lomba.some(l =>
    l.judul.toLowerCase().includes(nama.toLowerCase())
  );

  if (!ditemukan) {
    alert("❌ Nama tidak ditemukan di data lomba!");
    return;
  }

  const noWA = "6282251949757";

  const text = `📩 KONFIRMASI%0A
Nama: ${nama}%0A
Kelas: ${kelas}%0A
Lomba: ${lombaInput}%0A
Juara: ${juara}%0A
Pesan: ${pesan}`;

  window.open(`https://wa.me/${noWA}?text=${text}`, "_blank");
}

search.addEventListener("input", function() {
  const keyword = this.value.toLowerCase();
  const hasil = lomba.filter(l =>
    l.judul.toLowerCase().includes(keyword)
  );
  tampil(hasil);
});

tampil(lomba);

</script>

</body>
</html>
