<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pengumuman Lomba</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      background: #1e293b;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      color: #38bdf8;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .search-box {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-bottom: 20px;
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
      border: 1px solid transparent;
    }

    .card:hover {
      transform: scale(1.03);
      border: 1px solid #38bdf8;
    }

    .card h3 {
      margin: 0;
      color: #38bdf8;
    }

    .card p {
      font-size: 14px;
      color: #cbd5e1;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      background: #38bdf8;
      color: black;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 10px;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
    }

    .close {
      float: right;
      cursor: pointer;
      color: red;
      font-size: 20px;
    }

    .juara {
      background: #0ea5e9;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
      color: black;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      border: none;
      background: #38bdf8;
      color: black;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  🎉 Pengumuman Lomba SMK KRISTEN PELANGI MAKALE
</header>

<div class="container">

  <input type="text" class="search-box" id="search" placeholder="Cari lomba...">

  <div class="grid" id="listLomba"></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="tutupModal()">✖</span>
    <h2 id="judul"></h2>
    <p id="detail"></p>

    <div class="juara">
      <b>🏆 Daftar Juara:</b>
      <p id="juara"></p>
    </div>

    <button onclick="tutupModal()">Tutup</button>
  </div>
</div>

<script>
const lomba = [
  {
    judul: "Lomba Coding TKJ",
    deskripsi: "Membuat aplikasi web sederhana.",
    detail: "Tanggal: 30 juni 2026\nLokasi: Lab Komputer\nHadiah: Uang Pendidikan",
    juara: `
🥇 Juara 1: Asef<br>
🥈 Juara 2: .....<br>
🥉 Juara 3: .....<br>
    Harapan 1: .....<br>
    Juara 2: .....
`
  },
  {
    judul: "Lomba Desain Poster",
    deskripsi: "Poster tema teknologi.",
    detail: "Tanggal: 27 Mei 2026\nLokasi: Ruang Multimedia\nHadiah: Sertifikat + Merchandise",
    juara: `
🥇 Juara 1: .....<br>
🥈 Juara 2: .....<br>
🥉 Juara 3: ....
    `
  },
  {
    judul: "Lomba Jaringan Komputer",
    deskripsi: "Setting LAN & troubleshooting.",
    detail: "Tanggal: 30 Mei 2026\nLokasi: Lab TKJ\nHadiah: Sertifikat + Piala",
    juara: `
🥇 Juara 1: .....<br>
🥈 Juara 2: .....<br>
🥉 Juara 3: .....
    `
  }
];

const list = document.getElementById("listLomba");
const search = document.getElementById("search");

function tampil(data) {
  list.innerHTML = "";
  data.forEach((item, index) => {
    list.innerHTML += `
      <div class="card" onclick="bukaModal(${index})">
        <h3>${item.judul}</h3>
        <p>${item.deskripsi}</p>
        <span class="badge">Lihat Detail</span>
      </div>
    `;
  });
}

function bukaModal(index) {
  document.getElementById("judul").innerText = lomba[index].judul;
  document.getElementById("detail").innerText = lomba[index].detail;
  document.getElementById("juara").innerHTML = lomba[index].juara;
  document.getElementById("modal").style.display = "flex";
}

function tutupModal() {
  document.getElementById("modal").style.display = "none";
}

search.addEventListener("input", function() {
  const keyword = this.value.toLowerCase();
  const hasil = lomba.filter(l =>
    l.judul.toLowerCase().includes(keyword)
  );
  tampil(hasil);
});

tampil(lomba);
</script>

</body>
</html>
